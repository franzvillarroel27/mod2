version: '3.8'

services:
  # Base de datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: trrs_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=trrs_db
      - POSTGRES_USER=trrs_user
      - POSTGRES_PASSWORD=trrs_password_2024
    ports:
      - "5432:5432"
    networks:
      - trrs_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trrs_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para caché y Celery
  redis:
    image: redis:7-alpine
    container_name: trrs_redis
    ports:
      - "6379:6379"
    networks:
      - trrs_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Django
  web:
    build: .
    container_name: trrs_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - DATABASE_URL=postgresql://trrs_user:trrs_password_2024@db:5432/trrs_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trrs_network

  # Celery Worker para tareas asíncronas
  celery:
    build: .
    container_name: trrs_celery
    command: celery -A trrs_project worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - DATABASE_URL=postgresql://trrs_user:trrs_password_2024@db:5432/trrs_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    networks:
      - trrs_network

  # Celery Beat para tareas programadas
  celery-beat:
    build: .
    container_name: trrs_celery_beat
    command: celery -A trrs_project beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - DATABASE_URL=postgresql://trrs_user:trrs_password_2024@db:5432/trrs_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    networks:
      - trrs_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  trrs_network:
    driver: bridge
